apiVersion: v1
kind: ConfigMap
metadata:
  name: scaler-api-script
data:
  scaler-api.py: |
    from flask import Flask, jsonify
    import random
    app = Flask(__name__)
    @app.route('/metrics')
    def metrics():
        return jsonify({"hybrid_desired_replicas": random.randint(1, 10)})
    if __name__ == '__main__':
        app.run(host='0.0.0.0', port=5000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaler-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaler-api
  template:
    metadata:
      labels:
        app: scaler-api
    spec:
      containers:
      - name: api
        image: python:3.10-slim
        command: ["/bin/sh", "-c", "pip install flask && python /app/scaler-api.py"]
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: script-volume
          mountPath: /app
      volumes:
      - name: script-volume
        configMap:
          name: scaler-api-script
---
apiVersion: v1
kind: Service
metadata:
  name: scaler-api-service
spec:
  selector:
    app: scaler-api
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
